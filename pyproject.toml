[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "observe"
version = "0.2.5"
description = "Deployment-agnostic in-process observability middleware"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.16",
    "werkzeug>=3",
    # Exercises the GitHub App sink; the sink itself keeps it optional.
    "cryptography>=42",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
observe = ["shim/*.js", "py.typed"]

[tool.ruff]
extend = ".config/ruff.toml"
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["W", "N", "SIM", "ARG", "PTH", "RET", "TID", "PYI", "ANN"]
# Any is used on purpose at the untyped WSGI/ASGI/http.server boundaries.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Test doubles must match the Sink / ASGI signatures they stand in for.
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "sinks", "tests"]
mypy_path = ["src", "sinks/github/src", "sinks/sentry/src"]

[[tool.mypy.overrides]]
module = "sentry_sdk.*"
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "sinks/github/src", "sinks/sentry/src"]
