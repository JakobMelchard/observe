[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "observe"
version = "0.1.0"
description = "Deployment-agnostic observability sidecar"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.5",
    "werkzeug>=3",
    # Exercises the GitHub App sink; the sink itself keeps it optional.
    "cryptography>=42",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
observe = ["shim/*.js", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["contrib"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ARG", "PTH", "RET", "TID", "PYI"]

[tool.ruff.lint.per-file-ignores]
# Test doubles must match the Sink / ASGI signatures they stand in for.
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "sinks", "tests"]
mypy_path = ["src", "sinks/github/src", "sinks/sentry/src"]
exclude = "contrib"

[[tool.mypy.overrides]]
module = "sentry_sdk.*"
ignore_missing_imports = true

# Tests are checked, but test doubles and fixtures are not required to be
# annotated — strict typing is for the code that ships.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "sinks/github/src", "sinks/sentry/src"]
