name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: JakobMelchard/.github/.github/workflows/python.yml@e1ef2b10e7ee0c5426f78d63a4e9c6a0ce9b3fe9 # v1.6.0
    with:
      python-version: "3.11"
      lint-cmd: "ruff check . && uv run ruff format --check . && uv run mypy"

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@e1ef2b10e7ee0c5426f78d63a4e9c6a0ce9b3fe9 # v1.6.0
