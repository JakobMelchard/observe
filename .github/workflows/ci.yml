name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: JakobMelchard/.github/.github/workflows/python.yml@da5c1f89e2029e3f3e7a39a5dc1c9f9d5ad2084e # v2.2.3
    with:
      python-version: "3.11"
      lint-cmd: "ruff check . && uv run ruff format --check . && uv run mypy"

  # Type-checks the browser shim and its node tests (tsc --checkJs, strict). biome lints them in hooks.
  shim:
    uses: JakobMelchard/.github/.github/workflows/node.yml@da5c1f89e2029e3f3e7a39a5dc1c9f9d5ad2084e # v2.2.3
    with:
      check-cmd: npm run typecheck
      lint-cmd: ""

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@da5c1f89e2029e3f3e7a39a5dc1c9f9d5ad2084e # v2.2.3
