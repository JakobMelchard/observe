name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: JakobMelchard/.github/.github/workflows/python.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
    with:
      python-version: "3.11"
      lint-cmd: "ruff check . && uv run ruff format --check . && uv run mypy"

  # Type-checks the browser shim and its node tests (tsc --checkJs, strict). biome lints them in hooks.
  shim:
    uses: JakobMelchard/.github/.github/workflows/node.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
    with:
      check-cmd: npm run typecheck
      lint-cmd: ""

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
