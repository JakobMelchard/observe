name: automerge

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]

permissions: {}

jobs:
  automerge:
    uses: JakobMelchard/.github/.github/workflows/automerge.yml@88bfcf0fb6db99ff67f1e0e8f082f9b7e391028d # v2.4.1
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      id-token: write
