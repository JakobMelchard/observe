name: automerge

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]

permissions: {}

jobs:
  automerge:
    uses: JakobMelchard/.github/.github/workflows/automerge.yml@3136823a60259dfcfa34f4b81623472810a67d2b # main
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      id-token: write
