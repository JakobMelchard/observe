name: automerge

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]

permissions: {}

jobs:
  automerge:
    uses: JakobMelchard/.github/.github/workflows/automerge.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      id-token: write
