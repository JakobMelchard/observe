name: automerge

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]

permissions: {}

jobs:
  automerge:
    uses: JakobMelchard/.github/.github/workflows/automerge.yml@1a10ff74d74f3e87475bfd72753b712557ad619b # v2.7.0
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      id-token: write
