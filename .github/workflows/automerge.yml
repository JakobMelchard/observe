name: automerge

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]

permissions: {}

jobs:
  automerge:
    uses: JakobMelchard/.github/.github/workflows/automerge.yml@da5c1f89e2029e3f3e7a39a5dc1c9f9d5ad2084e # v2.2.3
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      id-token: write
