name: automerge

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]

permissions: {}

jobs:
  automerge:
    uses: JakobMelchard/.github/.github/workflows/automerge.yml@4258fca96cbd14e90054debed585f9cf8aad04f7 # v2.1.0
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      id-token: write
