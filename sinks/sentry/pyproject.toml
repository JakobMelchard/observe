[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "observe-sentry"
version = "0.2.4"
description = "Sentry sink for observe sidecar"
license = "MIT"
requires-python = ">=3.11"
# The consumer picks where `observe` comes from via [tool.uv.sources].
dependencies = [
    "sentry-sdk>=2",
    "observe",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
observe_sentry = ["py.typed"]
