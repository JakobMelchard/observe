[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "observe-github"
version = "0.1.0"
description = "GitHub issue sink for observe"
requires-python = ">=3.11"
# The consumer picks where `observe` comes from via [tool.uv.sources].
dependencies = [
    "observe",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
observe_github = ["py.typed"]
