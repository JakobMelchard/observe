# Hooks come from pinned repos; Renovate bumps the revs. CI runs the same config through
# JakobMelchard/.github hooks.yml. Setup: brew install prek && prek install
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.15
    hooks:
      - id: biome-ci
        exclude: ^contrib/
  - repo: local
    hooks:
      # Needs the project env (uv sync --extra dev); CI runs it in the python job instead.
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
  - repo: https://github.com/JakobMelchard/.githooks
    rev: v1.0.0
    hooks:
      - id: conventional-commit
